<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culture | Catálogo de Hoodies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page-category="sueteres" class="bg-zinc-50 text-zinc-900 font-sans antialiased">

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-zinc-100">
        <div class="max-w-7xl mx-auto px-6 py-3 flex flex-col sm:flex-row justify-between items-center gap-3 sm:gap-0">
            <a href="index.html" class="flex items-center group">
                <img src="img/sin-fondo-black.png" alt="Culture Logo" class="h-10 sm:h-12 w-auto object-contain transition-all duration-300 filter drop-shadow-[0_0_6px_rgba(236,72,153,0.8)] group-hover:drop-shadow-[0_0_12px_rgba(236,72,153,1)]">
            </a>
            <div class="font-bold text-[11px] sm:text-sm tracking-widest uppercase">
                <a href="index.html" class="text-zinc-600 hover:text-pink-500 transition-colors duration-300 flex items-center">
                    <i class="fas fa-arrow-left mr-2"></i>Volver al Inicio
                </a>
            </div>
        </div>
    </nav>

    <header class="bg-zinc-900 text-white py-16 text-center relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-r from-pink-500/10 to-transparent z-0"></div>
        <div class="relative z-10 px-4">
            <h1 class="text-3xl md:text-5xl font-black tracking-tight uppercase italic">Colección Hoodies</h1>
            <p class="text-zinc-400 mt-2 text-xs tracking-widest uppercase font-semibold">Selecciona una cápsula para ver las prendas</p>
            <div class="h-1 w-12 bg-pink-500 mx-auto mt-4"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <div class="max-w-md mx-auto mb-12 relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-zinc-400">
                <i class="fas fa-search text-xs"></i>
            </div>
            <input type="text" 
                   id="search-input" 
                   placeholder="Buscar catálogo..." 
                   class="w-full pl-10 pr-4 py-3 bg-white border border-zinc-200 text-sm font-medium uppercase tracking-wider rounded-full focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition-all placeholder:text-zinc-400 placeholder:normal-case shadow-sm">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8" id="catalog-grid">
            <!-- Renderizado dinámico vía JS (portadas.js) -->
        </div>
    </main>

    <footer class="bg-white py-12 border-t border-zinc-100 mt-20">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <img src="img/sin-fondo-black.png" alt="Culture Logo" class="h-12 mx-auto mb-6 grayscale hover:grayscale-0 transition-all duration-300">
            <p class="text-zinc-400 text-xs tracking-widest uppercase">Culture © 2026 - Algodón Premium 100%</p>
        </div>
    </footer>

    <script src="js/portadas.js"></script>
</body>
</html>
